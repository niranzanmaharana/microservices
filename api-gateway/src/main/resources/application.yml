#api-gateway
server:
  port: 8082

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8010/eureka
spring:
  application:
    name: api-gateway # this microservice will be registered with eureka with this name
  config:
    import: optional:configserver:http://localhost:8012
  cloud:
    gateway:
      routes[0]:
        id: users-ws-status-check
        uri: lb://user-service
        predicates[0]: Path=/user-service/users/status
        predicates[1]: Method=GET
        predicates[2]: Header=Authorization, Bearer (.*)
        filters[0]: RemoveRequestHeader=Cookie
        filters[1]: RewritePath=/user-service/(?<segment>.*), /$\{segment}
        filters[2]: AuthorizationHeaderFilter
      routes[1]:
        id: user-ws-user-creation
        uri: lb://user-service
        predicates[0]: Path=/user-service/users
        predicates[1]: Method=POST
        filters[0]: RemoveRequestHeader=Cookie
        filters[1]: RewritePath=/user-service/(?<segment>.*), /$\{segment}
      routes[2]:
        id: user-ws-user-creation
        uri: lb://user-service
        predicates[0]: Path=/user-service/users/login
        predicates[1]: Method=POST
        filters[0]: RemoveRequestHeader=Cookie
        filters[1]: RewritePath=/user-service/(?<segment>.*), /$\{segment}
      routes[3]:
        id: user-ws-user-get-update-delete
        uri: lb://user-service
        predicates[0]: Path=/user-service/users/**
        predicates[1]: Method=GET,POST,UPDATE,DELETE
        predicates[2]: Header=Authorization, Bearer (.*)
        filters[0]: RemoveRequestHeader=Cookie
        filters[1]: RewritePath=/user-service/(?<segment>.*), /$\{segment}
        filters[2]: AuthorizationHeaderFilter
      routes[4]:
        id: user-h2-console
        uri: lb://user-service
        predicates[0]: Path=/user-service/h2-console
        predicates[1]: Method=GET
        filters[0]: RemoveRequestHeader=Cookie
        filters[1]: RewritePath=/user-service/(?<segment>.*), /$\{segment}

#      discovery:
#        locator:
#          enabled: true # enables automatic routing with api gateway
#          lower-case-service-id: true # allows only lower case service name registered with discovery service